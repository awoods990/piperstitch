# The third copy. GitHub holds the code, the marketing site, the videos
# and the history; this puts a complete, self-contained mirror of all of
# it in the same bucket the two services back themselves up to — so the
# answer to "what if Railway is gone?" and "what if GitHub is gone?" is
# the same bucket, not a shrug.
#
# A git bundle is the whole repository in one file: clone it back with
# `git clone piperstitch.bundle piperstitch` and you have every commit,
# branch and tag, offline.
name: offsite-backup
on:
  schedule:
    - cron: "30 4 * * 0"        # Sundays, after the services have taken theirs
  workflow_dispatch:

jobs:
  bundle:
    name: Mirror the repository off-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # every commit, or it isn't a backup

      - name: Build the bundle
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          git bundle create "piperstitch-${stamp}.bundle" --all
          sha256sum "piperstitch-${stamp}.bundle" > "piperstitch-${stamp}.bundle.sha256"
          ls -lh "piperstitch-${stamp}.bundle"
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"

      - name: Put it in the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_REGION || 'us-east-1' }}
          ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            echo "::warning::No bucket configured — add the BACKUP_* secrets to this repository." && exit 0
          fi
          aws --endpoint-url "$ENDPOINT" s3 cp "piperstitch-${STAMP}.bundle" "s3://$BUCKET/repository/piperstitch-${STAMP}.bundle"
          aws --endpoint-url "$ENDPOINT" s3 cp "piperstitch-${STAMP}.bundle.sha256" "s3://$BUCKET/repository/piperstitch-${STAMP}.bundle.sha256"
          # Read it back: an upload nobody checked is a belief, not a backup.
          aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/repository/piperstitch-${STAMP}.bundle" check.bundle
          sha256sum -c "piperstitch-${STAMP}.bundle.sha256" < /dev/null || true
          test "$(sha256sum check.bundle | cut -d' ' -f1)" = "$(cut -d' ' -f1 "piperstitch-${STAMP}.bundle.sha256")"
          git bundle verify check.bundle
          echo "Verified: the bundle in the bucket is a complete, clonable repository."

      - name: Keep the last twelve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_REGION || 'us-east-1' }}
          ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          [ -z "${BUCKET:-}" ] && exit 0
          keys="$(aws --endpoint-url "$ENDPOINT" s3 ls "s3://$BUCKET/repository/" | awk '{print $4}' | grep '\.bundle$' | sort)"
          count="$(echo "$keys" | wc -l)"
          if [ "$count" -gt 12 ]; then
            echo "$keys" | head -n "$((count - 12))" | while read -r old; do
              aws --endpoint-url "$ENDPOINT" s3 rm "s3://$BUCKET/repository/$old" "s3://$BUCKET/repository/$old.sha256" || true
            done
          fi
