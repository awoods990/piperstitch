# Proves the web edition builds where it will run -- Linux -- on every
# push, since the development Mac has no Docker. The Mac app's own build
# and tests are separate (they need macOS) and unaffected by this.
name: web
on:
  push:
    paths: ["Sources/StitchPilotCore/**", "Package.swift", "server/**", "web/**", ".github/workflows/web.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  server-linux:
    name: Swift server (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build server (release)
        working-directory: server
        run: swift build -c release --product StitchPilotServer
      - name: Smoke test
        working-directory: server
        run: |
          apt-get update -qq && apt-get install -y -qq curl >/dev/null
          .build/release/StitchPilotServer serve --env production --port 8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/v1/health && break; sleep 1; done
          curl -sf localhost:8080/api/v1/catalog | head -c 200

  web-build:
    name: Browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [server-linux, web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: piperstitch-web:ci
