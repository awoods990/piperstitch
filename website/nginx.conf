# The marketing site as a static server. TLS, compression to the client
# and the public port are Railway's; this only serves files. The Mac
# edition's PHP download gate (register.php / get.php / thank-you.php) is
# gone with the web launch -- it lives in git history if the Mac app ever
# needs it back.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host, matching every page's <link rel="canonical">.
    if ($host = "piperstitch.com") { return 301 https://www.piperstitch.com$request_uri; }

    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Partner links: piperstitch.com/r/<CODE> is answered by the account
    # service, which logs the click, sets the referral cookie and shows
    # the partner's landing page.
    location ^~ /r/ { return 302 https://admin.piperstitch.com$request_uri; }
    # Everything under /partners/ -- the portal, the gated program details
    # and terms, the registration and the application -- is the account
    # service. The public teaser is the one page served here.
    location ^~ /partners/ { return 302 https://admin.piperstitch.com$request_uri; }

    # The teaser's permanent address is /partners, with no extension: it is
    # what the video says, what the printed kit shows and what partners read
    # aloud, and an extension is the part of a spoken URL people get wrong.
    # Served by an exact location rather than through try_files so the 301
    # below cannot form a loop; .html redirects to it so the page has one
    # address and the link equity from anywhere already pointing at the old
    # form follows it.
    location = /partners      { try_files /partners.html =404; }
    location = /partners.html { return 301 https://www.piperstitch.com/partners; }

    # /pricing -> pricing.html, so the short URLs on printed material work.
    location / { try_files $uri $uri.html $uri/ =404; }

    location ~* \.(css|js)$ { expires 1h; }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ { expires 30d; }
    location ~* \.json$ { expires 5m; }
    location ~* \.(php|htaccess)$ { return 404; }
    location ~ /\. { return 404; }
}
