# The marketing site as a static server. TLS, compression to the client
# and the public port are Railway's; this only serves files. The Mac
# edition's PHP download gate (register.php / get.php / thank-you.php) is
# gone with the web launch -- it lives in git history if the Mac app ever
# needs it back.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host, matching every page's <link rel="canonical">.
    if ($host = "piperstitch.com") { return 301 https://www.piperstitch.com$request_uri; }

    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # /pricing -> pricing.html, so the short URLs on printed material work.
    location / { try_files $uri $uri.html $uri/ =404; }

    location ~* \.(css|js)$ { expires 7d; }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ { expires 30d; }
    location ~* \.json$ { expires 5m; }
    location ~* \.(php|htaccess)$ { return 404; }
    location ~ /\. { return 404; }
}
