{% extends "base.html" %}
{% block body %}
<header>
  <a href="/admin" class="brand" style="display:flex; align-items:center; gap:9px">
    <img src="/static/images/piperstitch-mark.png" alt="" width="24" height="24">
    PiperStitch License Admin
  </a>
  <div class="header-right">
    <nav class="admin-nav">
      <a href="/admin" class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/admin/subscribers" class="{% if active_nav == 'subscribers' %}active{% endif %}">Subscribers</a>
      <a href="/admin/registrations" class="{% if active_nav == 'registrations' %}active{% endif %}">Registrations</a>
      <a href="/admin/promotions" class="{% if active_nav == 'promotions' %}active{% endif %}">Promotions</a>
      <a href="/admin/emails" class="{% if active_nav == 'emails' %}active{% endif %}">Emails</a>
      <a href="/admin/financials" class="{% if active_nav == 'financials' %}active{% endif %}">Financials</a>
      <a href="/admin/feedback" class="{% if active_nav == 'feedback' %}active{% endif %}">Feedback{% set n = unreviewed_feedback_count() %}{% if n %} <span class="pill" style="padding:1px 7px; font-size:.75em">{{ n }}</span>{% endif %}</a>
      <a href="/admin/updates" class="{% if active_nav == 'updates' %}active{% endif %}">Updates</a>
    </nav>
    <form method="post" action="/admin/logout"><button type="submit">Sign out</button></form>
  </div>
</header>
{% block admin_body %}{% endblock %}
{% endblock %}
